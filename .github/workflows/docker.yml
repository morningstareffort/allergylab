name: AllergyLab CI/CD        # label shown in the Actions tab
on: [push]                    # trigger: any push, any branch
jobs:                         # the work to do
  build:                      # one job, named "build"
    runs-on: ubuntu-latest    # fresh GitHub-hosted Linux VM per run
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build images
        run: |
          cd Part7a
          docker build -t ${{ secrets.DOCKER_USERNAME }}/al-app:latest ./app
          docker build -t ${{ secrets.DOCKER_USERNAME }}/al-db-loader:latest ./db-loader
          docker build -t ${{ secrets.DOCKER_USERNAME }}/al-email:latest ./email
